<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>RedAyuda Colombia</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Red ciudadana para coordinar puntos de acopio, comidas y alertas de ayuda humanitaria en Colombia."
    />
    <meta name="theme-color" content="#245d46" />
    <meta name="application-name" content="RedAyuda Colombia" />
    <link rel="canonical" href="https://redayudacolombia.com/inicio" />

    <!-- Vista previa al compartir (WhatsApp, Facebook, LinkedIn, Telegram...).
       Los rastreadores no ejecutan JavaScript: estas etiquetas tienen que estar
       en el HTML servido, no inyectadas por Angular, y con URLs absolutas. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RedAyuda Colombia" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:url" content="https://redayudacolombia.com/inicio" />
    <meta property="og:title" content="RedAyuda Colombia — Ayuda humanitaria coordinada" />
    <meta
      property="og:description"
      content="Encuentra puntos de acopio, comidas, alojamiento y alertas en tiempo real. Reporta viviendas afectadas y necesidades para que la ayuda llegue a donde hace falta."
    />
    <meta property="og:image" content="https://redayudacolombia.com/assets/brand/redayuda-og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="RedAyuda Colombia: brigadistas entregando ayuda en una zona afectada."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RedAyuda Colombia — Ayuda humanitaria coordinada" />
    <meta
      name="twitter:description"
      content="Encuentra puntos de acopio, comidas, alojamiento y alertas en tiempo real. Reporta viviendas afectadas y necesidades para que la ayuda llegue a donde hace falta."
    />
    <meta
      name="twitter:image"
      content="https://redayudacolombia.com/assets/brand/redayuda-og.jpg"
    />

    <link rel="manifest" href="site.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Se pinta antes de descargar Angular para que nunca haya una pantalla blanca. -->
    <style>
      html,
      body {
        min-height: 100%;
      }
      body {
        margin: 0;
        background: #f8faf6;
      }
      /* Mientras la portada tapa la pantalla nada se mueve detrás. */
      body.is-booting {
        overflow: hidden;
      }
      .boot-loader {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: 24px;
        overflow: hidden;
        color: #17231d;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        text-align: center;
        background:
          radial-gradient(circle at 20% 18%, rgba(223, 105, 79, 0.12), transparent 24rem),
          radial-gradient(circle at 82% 78%, rgba(18, 88, 64, 0.13), transparent 29rem), #f8faf6;
      }
      /* La aplicación la retira cuando la primera pantalla ya está entera.
         `visibility` espera a que termine el desvanecido para no cortarlo. */
      .boot-loader.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 320ms ease,
          visibility 0s linear 320ms;
      }
      .boot-loader::before {
        position: absolute;
        top: -180px;
        right: -130px;
        width: 390px;
        height: 390px;
        border: 1px solid rgba(18, 88, 64, 0.1);
        border-radius: 50%;
        box-shadow:
          0 0 0 48px rgba(18, 88, 64, 0.025),
          0 0 0 96px rgba(18, 88, 64, 0.018);
        content: '';
      }
      .boot-card {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        box-sizing: border-box;
        width: min(430px, calc(100vw - 48px));
        gap: 17px;
        padding: 34px 34px 29px;
        border: 1px solid rgba(18, 88, 64, 0.12);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.74);
        box-shadow: 0 28px 80px rgba(33, 66, 51, 0.12);
      }
      .boot-emblem {
        position: relative;
        display: grid;
        width: 112px;
        height: 112px;
        place-items: center;
      }
      .boot-emblem::before {
        position: absolute;
        inset: 0;
        border: 3px solid rgba(18, 88, 64, 0.08);
        border-top-color: #125840;
        border-right-color: #df694f;
        border-radius: 50%;
        content: '';
        animation: boot-orbit 1.15s linear infinite;
      }
      .boot-emblem::after {
        position: absolute;
        inset: 15px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 12px 34px rgba(18, 88, 64, 0.12);
        content: '';
      }
      .boot-emblem img {
        position: relative;
        z-index: 1;
        width: 72px;
        height: 72px;
        object-fit: contain;
      }
      .boot-copy {
        display: grid;
        gap: 7px;
        justify-items: center;
      }
      .boot-copy small {
        color: #125840;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      .boot-copy strong {
        max-width: 360px;
        font:
          650 clamp(25px, 5vw, 34px)/1.05 Georgia,
          'Times New Roman',
          serif;
        letter-spacing: -0.025em;
      }
      .boot-copy span {
        max-width: 330px;
        color: #68756e;
        font-size: 13px;
        line-height: 1.5;
      }
      .boot-dots {
        display: inline-flex;
        gap: 5px;
      }
      .boot-dots i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #df694f;
        animation: boot-dot 1.15s ease-in-out infinite;
      }
      .boot-dots i:nth-child(2) {
        animation-delay: 140ms;
      }
      .boot-dots i:nth-child(3) {
        animation-delay: 280ms;
      }
      @keyframes boot-orbit {
        to {
          transform: rotate(1turn);
        }
      }
      @keyframes boot-dot {
        0%,
        60%,
        100% {
          opacity: 0.3;
          transform: translateY(0);
        }
        30% {
          opacity: 1;
          transform: translateY(-4px);
        }
      }
      @media (max-width: 560px) {
        .boot-card {
          gap: 15px;
          padding: 28px 22px 25px;
          border-radius: 23px;
        }
        .boot-emblem {
          width: 96px;
          height: 96px;
        }
        .boot-emblem img {
          width: 62px;
          height: 62px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-emblem::before,
        .boot-dots i {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="is-booting">
    <app-root></app-root>

    <!-- Vive fuera de <app-root> a propósito: Angular vacía el contenido de la etiqueta al
       arrancar, y esta portada tiene que seguir puesta hasta que la primera pantalla esté
       armada. La retira la propia aplicación (`hideBootCover`). -->
    <div
      id="boot-loader"
      class="boot-loader"
      role="status"
      aria-live="polite"
      aria-label="Preparando RedAyuda"
    >
      <div class="boot-card">
        <span class="boot-emblem" aria-hidden="true">
          <img
            src="/assets/brand/redayuda-mark-192.png"
            alt=""
            width="72"
            height="72"
            fetchpriority="high"
          />
        </span>
        <span class="boot-copy">
          <small>RedAyuda</small>
          <strong>Conectando ayuda con quienes la necesitan</strong>
          <span>Estamos preparando información confiable para que puedas actuar.</span>
        </span>
        <span class="boot-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
    </div>
  </body>
</html>
