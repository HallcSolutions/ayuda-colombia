<header class="site-header">
  <a
    class="brand"
    routerLink="/inicio"
    [attr.aria-label]="t('brand.name') + ', ' + t('brand.tagline')"
  >
    <span class="brand-mark" aria-hidden="true">
      <img src="/assets/brand/redayuda-mark-192.png" alt="" width="48" height="48" />
    </span>
    <span
      ><strong>{{ t('brand.name') }}</strong
      ><small>{{ t('brand.tagline') }}</small></span
    >
  </a>

  <nav
    id="nav-tabs"
    class="nav-tabs"
    [class.is-open]="menuOpen()"
    [attr.aria-label]="t('brand.name')"
  >
    @for (tab of tabs; track tab.path) {
      <a
        [routerLink]="tab.path"
        routerLinkActive="active"
        [attr.data-badge]="tab.badge?.() || null"
        (click)="closeMenu()"
      >
        {{ t(tab.labelKey) }}
      </a>
    }
  </nav>

  <div class="header-tools">
    <app-language-switcher />
    <button
      type="button"
      class="menu-toggle"
      aria-controls="nav-tabs"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? t('nav.closeMenu') : t('nav.openMenu')"
      (click)="toggleMenu()"
    >
      <span class="menu-bars" aria-hidden="true"></span>
    </button>
  </div>
</header>

<app-alert-banner />

<main id="inicio">
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <img src="/assets/brand/redayuda-mark-192.png" alt="" width="48" height="48" loading="lazy" />
    </span>
    <span
      ><strong>{{ t('brand.name') }}</strong
      ><small>{{ t('brand.tagline') }}</small></span
    >
  </div>
  <p>{{ t('footer.lead') }}</p>
  <p class="footer-support">
    {{ t('footer.support') }}
    <a href="https://wa.me/573207147271" target="_blank" rel="noopener"> WhatsApp 320 714 7271 </a>
  </p>
  <span>{{ t('footer.signature') }}</span>
</footer>
