@if (record(); as perla) {
  <aside id="como-ayudar-perla" class="search-help" aria-labelledby="perla-help-title">
    <div class="search-help__copy">
      <span>{{ t('missing.help.eyebrow') }}</span>
      <h3 id="perla-help-title">{{ t('missing.help.title') }}</h3>
      <p>{{ t('missing.help.body') }}</p>
      <strong>{{ t('missing.help.location') }}</strong>
    </div>
    <div class="search-help__actions">
      <a [href]="perlaWhatsapp" target="_blank" rel="noopener noreferrer">
        {{ t('missing.help.whatsapp') }} <span aria-hidden="true">↗</span>
      </a>
      <button type="button" (click)="shareHelp(perla)">
        {{ shareResult() === 'copied' ? t('share.linkCopied') : t('share.action') }}
        <span aria-hidden="true">↗</span>
      </button>
      <a class="search-help__case" [routerLink]="missingPathFor(perla)">
        {{ t('missing.help.case') }} <span aria-hidden="true">→</span>
      </a>
      @if (shareResult() === 'failed') {
        <p class="search-help__error" role="alert">{{ t('share.error') }}</p>
      }
    </div>
  </aside>
}
